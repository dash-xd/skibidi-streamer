name: Deploy Dev Worker

on:
  push:
    branches: [dev]

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Run Docker Compose with secrets from GitHub Actions
      - name: Deploy Worker via Docker Compose
        run: docker compose up --build --abort-on-container-exit wrangler
        env:
          IMAGE_NAME: dev-worker
          IMAGE_TAG: latest
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          ENTRYPOINT: wrangler publish --env dev
