name: Deploy GitHub Pages

on:
  push:
    branches:
      - iframe-workspace
    paths:
      - .github/dispatch/pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-iframe-workspace
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: pages-iframe-workspace
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Keep Pages deployment limited to browser assets only.
      - name: Stage static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/app
          cp index.html workspace.css workspace.js _site/
          cp app/app.html app/app_dark.html app/dark.css _site/app/

          # GitHub Pages/CDN may cache static assets across deployments. Tie the
          # document's CSS/JS URLs to this exact commit so HTML and behavior can
          # never come from different revisions.
          sed -i "s|./workspace.css|./workspace.css?v=${GITHUB_SHA}|" _site/index.html
          sed -i "s|./workspace.js|./workspace.js?v=${GITHUB_SHA}|" _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
