name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/dispatch/pages
      - index.html
      - workspace.css
      - workspace.js
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Stage static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html workspace.css workspace.js _site/

          sed -i "s|./workspace.css|./workspace.css?v=${GITHUB_SHA}|" _site/index.html
          sed -i "s|./workspace.js|./workspace.js?v=${GITHUB_SHA}|" _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
