name: Deploy GitHub Pages

on:
  push:
    branches:
      - iframe-workspace
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Stage static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/app
          cp index.html workspace.css workspace.js _site/
          cp app/app.html app/app_dark.html app/dark.css _site/app/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
